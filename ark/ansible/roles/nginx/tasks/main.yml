---
# Role nginx — Rocky Linux 9.
# EPEL traz nginx, certbot e python3-certbot-nginx.
# Layout Rocky usa /etc/nginx/conf.d/*.conf (sem sites-available).

- name: Instalar Nginx e Certbot
  dnf:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

- name: Garantir diretorio de snippets
  file:
    path: /etc/nginx/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copiar ssl.conf de hardening (snippet)
  copy:
    src: "{{ playbook_dir }}/../nginx/ssl.conf"
    dest: /etc/nginx/snippets/ssl.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Renderizar vhost do portifolio
  template:
    src: portifolio.conf.j2
    dest: /etc/nginx/conf.d/portifolio.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Remover default.conf (se existir da instalacao)
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: reload nginx

- name: Garantir Nginx ativo
  service:
    name: nginx
    state: started
    enabled: true

- name: Obter certificado Let's Encrypt
  command: >
    certbot --nginx -d {{ dominio }}
    --agree-tos --non-interactive
    -m {{ letsencrypt_email }}
    --redirect
  args:
    creates: "/etc/letsencrypt/live/{{ dominio }}/fullchain.pem"
  tags: [tls]

- name: Habilitar renovacao automatica do certbot (timer)
  service:
    name: certbot-renew.timer
    state: started
    enabled: true
  ignore_errors: true
  tags: [tls]
