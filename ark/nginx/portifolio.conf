# Nginx vhost — portifolio analytics (REFERENCIA)
#
# Arquivo REAL em producao e renderizado pela role Ansible `nginx` a partir do
# template `ark/ansible/roles/nginx/templates/portifolio.conf.j2`. Este arquivo
# aqui serve como espelho versionado para revisao — mantenha em sincronia com
# o template (sem o Jinja).
#
# Requisitos:
#   - TLS via Cloudflare Origin Certificate em /etc/ssl/cloudflare-origin/
#   - backend Flask+Socket.IO escutando em 127.0.0.1:5000
#   - frontend (nginx:alpine servindo bundle Vite estatico) em 127.0.0.1:3000
#   - instalacao em /etc/nginx/conf.d/portifolio.conf (Rocky/RHEL layout)

limit_req_zone $binary_remote_addr zone=analytics_edge:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cliente_auth:10m rate=10r/s;

upstream portifolio_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream portifolio_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Grafana (dashboard self-service do cliente) — ver ark/docs/dashboard-cliente.md
upstream portifolio_grafana {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name dsplayground.com.br api.dsplayground.com.br;
    return 301 https://$host$request_uri;
}

# ============== Apex: frontend (React SPA servido por nginx no container) ==============
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dsplayground.com.br;

    ssl_certificate     /etc/ssl/cloudflare-origin/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    client_max_body_size 1m;
    access_log /var/log/nginx/portifolio.access.log;
    error_log  /var/log/nginx/portifolio.error.log warn;

    location / {
        proxy_pass http://portifolio_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ================== /api/* canonico (apex) ==================
    # Backend escuta paths SEM `/api/` (ver backend/app.py + auth/cliente_routes.py).
    # No apex `dsplayground.com.br/api/...`, strippamos o `/api/` aqui antes do
    # proxy_pass; no subdominio `api.dsplayground.com.br`, vhost separado abaixo
    # proxia direto sem rewrite (ja vem sem `/api/` por ser subdominio dedicado).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        # cliente_auth tem rate-limit dedicado; demais endpoints herdam o default.
        limit_req zone=cliente_auth burst=20 nodelay;
        proxy_pass http://portifolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cliente/metricas/ {
        auth_request /__cliente_auth_gate;
        auth_request_set $cliente_user  $upstream_http_x_webauth_user;
        auth_request_set $cliente_papel $upstream_http_x_webauth_papel;
        error_page 401 = @cliente_nao_autenticado;

        proxy_pass http://portifolio_grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER    $cliente_user;
        proxy_set_header X-WEBAUTH-PAPEL   $cliente_papel;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /__cliente_auth_gate {
        internal;
        proxy_pass http://portifolio_backend/cliente/auth/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location @cliente_nao_autenticado {
        return 302 /cliente/login;
    }
}

# ============== API: backend Flask + Socket.IO ==============
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dsplayground.com.br;

    ssl_certificate     /etc/ssl/cloudflare-origin/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    client_max_body_size 1m;
    access_log /var/log/nginx/portifolio-api.access.log;
    error_log  /var/log/nginx/portifolio-api.error.log warn;

    location / {
        limit_req zone=analytics_edge burst=40 nodelay;

        proxy_pass http://portifolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade para Socket.IO (path canonico: /socket.io/, sem /api/)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ==================== Rotas admin LGPD ====================
    # Restrinja por IP allowlist em producao. Exemplo:
    #
    # location ^~ /api/admin/ {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://portifolio_backend;
    #     ...
    # }

    # ==================== Metricas Prometheus ====================
    # Exponha metricas apenas internamente quando existir endpoint /metrics.
    #
    # location = /api/metrics {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://portifolio_backend;
    # }
}
