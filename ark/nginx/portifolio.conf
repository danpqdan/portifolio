# Nginx vhost — portifolio analytics
#
# Requisitos:
#   - TLS via Let's Encrypt (certbot) em /etc/letsencrypt/live/<dominio>/
#   - backend Flask+Socket.IO escutando em 127.0.0.1:5000 (ou via docker network)
#   - este arquivo em /etc/nginx/sites-available/ + symlink em sites-enabled
#
# Inclui ssl.conf para hardening. Ajustar `server_name` e caminhos dos certs
# antes de recarregar.

limit_req_zone $binary_remote_addr zone=analytics_edge:10m rate=20r/s;

upstream portifolio_backend {
    # Em docker compose de producao, `backend` resolve via rede interna.
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.example.com;

    # Forca HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.example.com;

    ssl_certificate     /etc/letsencrypt/live/analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.example.com/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    client_max_body_size 1m;  # payload de analytics e pequeno; limite previne abuso

    # Log de acesso separado do site principal
    access_log /var/log/nginx/portifolio.access.log;
    error_log  /var/log/nginx/portifolio.error.log warn;

    # ==================== Ingestao Socket.IO + API publica ====================
    location / {
        limit_req zone=analytics_edge burst=40 nodelay;

        proxy_pass http://portifolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade para WebSocket (Socket.IO)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Socket.IO mantem conexoes longas
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ==================== Rotas admin LGPD ====================
    # Restrinja por IP allowlist em producao. Exemplo:
    #
    # location ^~ /admin/ {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://portifolio_backend;
    #     ...
    # }

    # ==================== Metricas Prometheus ====================
    # Exponha metricas apenas internamente quando existir endpoint /metrics.
    #
    # location = /metrics {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://portifolio_backend;
    # }
}
