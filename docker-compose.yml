services:
  influxdb:
    image: influxdb:2.7
    container_name: portifolio-influxdb
    ports:
      # Acesso publico via nginx → influx.dsplayground.com.br. Sem bypass direto.
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?defina em .env}
      DOCKER_INFLUXDB_INIT_ORG: zen
      DOCKER_INFLUXDB_INIT_BUCKET: portifolio_prod
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina em .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: portifolio-backend
    depends_on:
      influxdb:
        condition: service_healthy
    # Backend so e acessivel via Nginx na host. Nunca 0.0.0.0:5000.
    ports:
      - "127.0.0.1:5000:5000"
    # Fonte unica de verdade: .env gerado pelo Ansible
    # (ark/ansible/roles/analytics-stack/templates/backend.env.j2).
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: portifolio-frontend
    depends_on:
      - backend
    # Frontend so e acessivel via Nginx na host (proxy para dsplayground.com.br).
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_URL: https://api.dsplayground.com.br
      VITE_WEBSOCKET_URL: https://api.dsplayground.com.br
      VITE_DEBUG: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  influxdb_data:
  influxdb_config:
  frontend_node_modules:
