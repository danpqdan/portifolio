services:
  influxdb:
    image: influxdb:2.7
    container_name: portifolio-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-local-12345
      DOCKER_INFLUXDB_INIT_ORG: zen
      DOCKER_INFLUXDB_INIT_BUCKET: portifolio_dev
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-local-influxdb-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: portifolio-backend
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py
      SECRET_KEY: dev-local-compose-secret
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      INFLUXDB_ENABLED: "true"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: dev-local-influxdb-token
      INFLUXDB_ORG: zen
      INFLUXDB_BUCKET: portifolio_dev
      TEMPORAL_REALTIME_INTERVAL: "5000"
      TEMPORAL_REGULAR_INTERVAL: "15000"
      TEMPORAL_CACHE_SIZE: "1000"
      TEMPORAL_CLEANUP_INTERVAL: "300"
      HOST: 0.0.0.0
      PORT: "5000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: portifolio-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WEBSOCKET_URL: http://localhost:5000
      VITE_DEBUG: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  influxdb_data:
  influxdb_config:
  frontend_node_modules:
